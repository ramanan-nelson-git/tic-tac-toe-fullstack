server.port=5080
spring.application.name=tic-tac-toe-api

# --- Actuator / Prometheus ---
# Exposed on the same port as the API: http://localhost:5080/actuator/...
# Ideally the actuator port should be different than the application port
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
# Added to every metric so dashboards can filter by app
management.metrics.tags.application=${spring.application.name}
# Latency histograms for http_server_requests_seconds (enables histogram_quantile in Prometheus)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
